[project]
name = "deepmail"
version = "0.1.0"
description = "DeepMail — AI Agent 邮箱助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 配置 / 校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.6",
    # 鉴权
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    # LLM
    "litellm>=1.51.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    # RAG
    "llama-index>=0.12.0",
    "llama-index-vector-stores-postgres>=0.4.0",
    # 工具
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    # Token 计数（v2-M1：按真实 token 触发压缩）
    "tiktoken>=0.7.0",
    # 日志 + 可观测性
    "structlog>=24.4.0",
    "langsmith>=0.1.0",
    # v2-M3：IMAP 邮件同步（网易 163/188）
    "imap-tools>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]